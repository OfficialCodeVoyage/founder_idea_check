# Local development stack.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHAT THIS FILE OWNS
#
#   postgres  ic-pg     pgvector/pgvector:pg17           host :5433  <- apps/chat data
#   redis     ic-redis  valkey/valkey:9.1.3-alpine3.24   host :6380  <- apps/chat cache
#   research  (built)   apps/research                    host :8099  <- signals sidecar
#
# NOT in this file, on purpose: SearXNG (AGPL-3.0). It is an opt-in overlay,
# docker-compose.searxng.yml, so that a default `docker compose up` pulls and
# runs no AGPL software. See "SEARXNG IS OPT-IN" below.
#
# Postgres and Redis were previously started by hand with bare `docker run`
# (see git history of README-DEV.md). They are adopted here so that ONE command
# brings the whole stack up and so that services added later share a network
# with them. `container_name:` is pinned to the historical names because the
# docs, and probably your shell history, say `docker exec ic-pg psql ...`.
#
# DATA. Adoption moved the Postgres data directory from the anonymous volume
# Docker created for it onto the named volume `pgdata` below. The original
# anonymous volume was NOT deleted; if this stack ever comes up with an empty
# database, that volume still holds the pre-adoption bytes.
#
# NETWORKING. Compose puts every service on the project's default network, so
# services reach each other by SERVICE NAME (`postgres:5432`, not
# `localhost:5433`). Note the asymmetry that bites: anything you run on the
# HOST — `bun run dev:local`, or the research sidecar started from its venv —
# is not on that network and must use the published host port instead. Any new
# service that host processes need to reach therefore has to publish a port,
# and its URL has to stay configurable.
#
# CREDENTIALS. Postgres uses postgres/postgres and Redis has no password. That
# is deliberate and is why both are published on 127.0.0.1 ONLY: the docs, the
# repo-root .env.local `DATABASE_URL`, and every `docker exec ic-pg psql -U
# postgres` incantation in README-DEV.md depend on those values, and rotating
# them buys nothing on an interface no other host can reach. If you ever bind
# these to a routable address, set a real password in the SAME commit.
#
# REDIS IS VALKEY. The `redis` service runs Valkey (BSD-3-Clause), the Linux
# Foundation fork of Redis 7.2, pinned to an exact tag. It replaced
# `redis:7-alpine`: that tag moves, and it now resolves to Redis 7.4.x, which has
# been source-available (RSALv2 / SSPLv1) rather than open source since 7.4.
# Valkey speaks the same protocol, so `REDIS_URL` (redis://localhost:6380) and the
# app's `redis` npm client are unchanged, and so are the container name, the port
# and the volume.
#
# ONE-TIME CLEAN-UP if you ran the old stack. A `redisdata` volume written by
# Redis 7.4 holds a `dump.rdb` in RDB format 12, which Valkey refuses by default,
# 9.1 included ("Can't handle RDB format version 12"), so `ic-redis` exits at
# start and restarts in a loop. This Redis only carries resumable-stream buffers
# and rate-limit counters, nothing worth keeping, so drop the volume once:
#
#     docker compose down && docker volume rm ideacheck_redisdata
#
# (To keep it instead, load it once with `valkey-server --rdb-version-check
# relaxed` in a throwaway `docker run --rm -v ideacheck_redisdata:/data` of the
# pinned image and `SAVE`. Do not add that flag to the service.) A volume written
# by Valkey 8.x loads in 9.1 normally.
#
# Rolling the image back is the reverse problem: a dump written by Valkey 9.1 is
# RDB format 80, which 8.x cannot read, so remove `ideacheck_redisdata` first
# (it only holds resumable-stream state).
#
# SEARXNG IS OPT-IN. SearXNG is AGPL-3.0 (its source files say AGPL-3.0-or-later).
# This repository copies none of its code: the overlay only names its published
# image and mounts our own `docker/searxng/settings.yml`. It lives in
# docker-compose.searxng.yml so that cloning the project and running
# `docker compose up` neither pulls nor runs it. To use it:
#
#     docker compose -f docker-compose.yml -f docker-compose.searxng.yml up -d searxng
#     RESEARCH_SEARXNG_URL=http://127.0.0.1:8888     # in the sidecar's environment
#
# Without it the `web-keyless` source asks DuckDuckGo's HTML endpoint alone, which
# many networks answer with a challenge page; the sidecar then reports `blocked`
# instead of an empty result. If you modify SearXNG, or run it for other people,
# read AGPL-3.0 section 13 first. Never patch the image: a patched build forfeits
# upstream security fixes whatever the licence says.
#
# NEO4J is still absent, and that is unrelated to licensing: OASIS defaults to
# the igraph IN-MEMORY backend (`oasis/social_agent/agent_graph.py:178-190` @
# 40bf1705 — neo4j needs an explicit `backend="neo4j"` plus a valid
# Neo4jConfig, and neither documented generator passes one). The `neo4j` driver
# is installed as an OASIS dependency and imported at module scope, but no
# connection is ever opened. A graph database here would be a service nobody
# talks to.
# ─────────────────────────────────────────────────────────────────────────────

name: ideacheck

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ic-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ideacheck
    ports:
      # 5433, not 5432 — port 5432 is routinely taken by an unrelated local
      # Postgres. `DATABASE_URL` in the repo-root .env.local points here.
      #
      # BOUND TO LOOPBACK. `- "5433:5432"` (no host) publishes on 0.0.0.0, which
      # puts a Postgres whose password is literally `postgres` on every network
      # this laptop joins — coffee shop wifi included. The bare `docker run` this
      # replaced had the same hole; it is closed here rather than inherited.
      # Compose-internal traffic is unaffected: services use `postgres:5432` on
      # the project network and never touch a published port.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ideacheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    # Valkey, not Redis: see "REDIS IS VALKEY" at the top. An exact tag on purpose;
    # bump it deliberately (look the tag up on Docker Hub: valkey/valkey) rather
    # than by following a moving one.
    image: valkey/valkey:9.1.3-alpine3.24
    container_name: ic-redis
    ports:
      # 6380, not 6379, for the same reason as above. Loopback-bound for the
      # same reason as Postgres, and more urgently: this Redis has NO password,
      # so an unauthenticated FLUSHALL is one `redis-cli -h` away from anyone
      # sharing the network.
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  research:
    build:
      context: ./apps/research
      # Default target: signals only. For Step 8, build with
      #   target: simulation
      # and expect a multi-gigabyte image (torch + sentence-transformers).
      # That image also contains igraph (GPL-2.0-or-later, pulled in by OASIS).
      # Build it for yourself if you like, but do not publish it: no simulation
      # image is published by this project. See THIRD_PARTY-research.md.
      target: base
    ports:
      # Loopback-bound like the other two. Its endpoints spend money (they
      # drive LLM calls), and with no RESEARCH_SIDECAR_TOKEN this container
      # serves unauthenticated callers (see RESEARCH_SIDECAR_ALLOW_UNAUTHENTICATED
      # below), so it must not be reachable from the network. `apps/chat` calls
      # it from the host.
      - "127.0.0.1:8099:8099"
    environment:
      # ─────────────────────────────────────────────────────────────────────
      # FAIL-CLOSED. `RESEARCH_HOSTED` is unset in `app/config.py` terms only
      # if it is absent; it defaults to TRUE there, which bars any source that
      # is barred in hosted mode. It is set explicitly to `false` here because a
      # LOCAL dev stack is self-host by definition — the developer is the only
      # user and their own data subject.
      #
      # DO NOT COPY THIS LINE INTO A DEPLOYED ENVIRONMENT. Read
      # `apps/research/app/sources/reddit_gate.py` first.
      # ─────────────────────────────────────────────────────────────────────
      RESEARCH_HOSTED: "false"

      # ─────────────────────────────────────────────────────────────────────
      # CALLER AUTH (`app/main.py::require_caller`). With RESEARCH_SIDECAR_TOKEN
      # set — here AND in the app's environment — every spending call must
      # carry it, and the line below has no effect.
      #
      # Without a token the sidecar normally serves loopback callers only. That
      # cannot work inside a container: the host's requests arrive from the
      # Docker bridge address, not from 127.0.0.1. So this dev stack turns the
      # loopback check off and relies on the 127.0.0.1-only port binding above
      # instead — the same protection Postgres and Redis get in this file.
      # The Host check stays on: a request must still be addressed to
      # localhost, 127.0.0.1 or [::1], which the app's default
      # `http://localhost:8099` is, so a DNS-rebinding page cannot use it.
      #
      # DO NOT COPY THIS LINE INTO A DEPLOYED ENVIRONMENT. Set
      # RESEARCH_SIDECAR_TOKEN there instead.
      # ─────────────────────────────────────────────────────────────────────
      RESEARCH_SIDECAR_ALLOW_UNAUTHENTICATED: "true"
      RESEARCH_SIDECAR_TOKEN: "${RESEARCH_SIDECAR_TOKEN:-}"

      # The default source set: Hacker News plus the keyless web ladder. Both
      # keyless, both legally boring. `arctic-shift` (the Reddit archive) and
      # `github` are NOT here: each is an opt-in for a reason (the archive
      # needs subreddits chosen for it, GitHub needs a token).
      RESEARCH_ENABLED_SOURCES: "hackernews,web-keyless"

      # Optional, and passed through rather than defaulted:
      #   GITHUB_TOKEN         — required by the `github` source
      #   RESEARCH_SEARXNG_URL — a SearXNG you run yourself, for example the
      #                          opt-in docker-compose.searxng.yml (reachable
      #                          from the host at http://127.0.0.1:8888)
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      RESEARCH_SEARXNG_URL: "${RESEARCH_SEARXNG_URL:-}"

      # Step 8. `RESEARCH_SIM_CONCURRENCY` overrides OASIS's `semaphore=`, whose
      # own default is 128 — high enough to 429 a shared gateway, and a 429
      # storm inside OASIS surfaces as agents that "chose to do nothing", which
      # is indistinguishable from genuine disinterest.
      # The default matches `oasis_runner.py::DEFAULT_MODEL`, so the container
      # and a sidecar started from the venv run the same model.
      RESEARCH_SIM_MODEL: "${RESEARCH_SIM_MODEL:-gpt-5.6-luna}"
      RESEARCH_SIM_BASE_URL: "${RESEARCH_SIM_BASE_URL:-}"
      RESEARCH_SIM_CONCURRENCY: "${RESEARCH_SIM_CONCURRENCY:-8}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8099/v1/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  # Named, so `docker compose down` and any later recreate reattach the same
  # bytes. Before adoption these were anonymous volumes, which compose would
  # not have reattached — it would have started an EMPTY database and looked
  # like it worked.
  pgdata:
  redisdata:
