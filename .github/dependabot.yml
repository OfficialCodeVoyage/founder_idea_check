# Version updates. Security updates are separate and are never delayed by a cooldown.
# Every ecosystem waits 7 days after a release before proposing it, and folds minor and
# patch bumps into one grouped pull request; a major bump gets its own pull request
# unless an `ignore` entry below holds it back.
version: 2
updates:
  # Bun workspaces (apps/chat, packages/*), one root bun.lock.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # The AI SDK moves as one set. ai@6 accepts only v2/v3 provider models, and the next
    # majors of these packages (ai 7, @ai-sdk/* on @ai-sdk/provider 4, the OpenRouter
    # provider 3) target AI SDK 7: a lone bump fails the type check and would throw
    # UnsupportedModelVersionError at runtime. Majors wait for a deliberate AI SDK 7
    # migration; minor and patch updates still arrive in the group above.
    ignore:
      - dependency-name: "ai"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@ai-sdk/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@openrouter/ai-sdk-provider"
        update-types: ["version-update:semver-major"]
      # Biome moves only together with the pinned ultracite: Biome 2.6 rejects the rule names
      # in ultracite@7.4.3's config, so `verify` stops before linting anything. Patches still flow.
      - dependency-name: "@biomejs/biome"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # lexical is pre-1.0, so each 0.x minor can break (0.32 → 0.53 retyped the
      # KEY_ENTER_COMMAND payload and changed Markdown escaping). It runs the chat input and
      # the text-document editor; upgrade it on purpose, with the editor checked by hand.
      - dependency-name: "lexical"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@lexical/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # better-auth moves together with the `@better-auth/core` override in the root
      # package.json; a lone bump installs a newer better-auth on top of the overridden core.
      - dependency-name: "better-auth"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@better-auth/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Research sidecar. `mcp` stays below 2 because camel-ai, pulled in by the OASIS extra,
  # imports a name that mcp 2 removed; see apps/research/pyproject.toml.
  - package-ecosystem: "pip"
    directory: "/apps/research"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "mcp"
        versions: [">=2"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # apps/research/Dockerfile. The base image stays on Python 3.11 for the same OASIS reason.
  - package-ecosystem: "docker"
    directory: "/apps/research"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Images in docker-compose.yml (Postgres with pgvector, Redis, SearXNG).
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
