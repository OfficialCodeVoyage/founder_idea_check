# Local development stack.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHAT THIS FILE OWNS
#
#   postgres  ic-pg     pgvector/pgvector:pg17   host :5433  <- apps/chat data
#   redis     ic-redis  redis:7-alpine           host :6380  <- apps/chat cache
#   research  (built)   apps/research            host :8099  <- signals sidecar
#
# Postgres and Redis were previously started by hand with bare `docker run`
# (see git history of README-DEV.md). They are adopted here so that ONE command
# brings the whole stack up and so that services added later share a network
# with them. `container_name:` is pinned to the historical names because the
# docs, and probably your shell history, say `docker exec ic-pg psql ...`.
#
# DATA. Adoption moved the Postgres data directory from the anonymous volume
# Docker created for it onto the named volume `pgdata` below. The original
# anonymous volume was NOT deleted; if this stack ever comes up with an empty
# database, that volume still holds the pre-adoption bytes.
#
# NETWORKING. Compose puts every service on the project's default network, so
# services reach each other by SERVICE NAME (`postgres:5432`, not
# `localhost:5433`). Note the asymmetry that bites: anything you run on the
# HOST — `bun run dev:local`, or the research sidecar started from its venv —
# is not on that network and must use the published host port instead. Any new
# service that host processes need to reach therefore has to publish a port,
# and its URL has to stay configurable.
#
# CREDENTIALS. Postgres uses postgres/postgres and Redis has no password. That
# is deliberate and is why both are published on 127.0.0.1 ONLY: the docs, the
# repo-root .env.local `DATABASE_URL`, and every `docker exec ic-pg psql -U
# postgres` incantation in README-DEV.md depend on those values, and rotating
# them buys nothing on an interface no other host can reach. If you ever bind
# these to a routable address, set a real password in the SAME commit.
#
# NEO4J is still absent, and that is unrelated to licensing: OASIS defaults to
# the igraph IN-MEMORY backend (`oasis/social_agent/agent_graph.py:178-190` @
# 40bf1705 — neo4j needs an explicit `backend="neo4j"` plus a valid
# Neo4jConfig, and neither documented generator passes one). The `neo4j` driver
# is installed as an OASIS dependency and imported at module scope, but no
# connection is ever opened. A graph database here would be a service nobody
# talks to.
# ─────────────────────────────────────────────────────────────────────────────

name: ideacheck

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ic-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ideacheck
    ports:
      # 5433, not 5432 — port 5432 is routinely taken by an unrelated local
      # Postgres. `DATABASE_URL` in the repo-root .env.local points here.
      #
      # BOUND TO LOOPBACK. `- "5433:5432"` (no host) publishes on 0.0.0.0, which
      # puts a Postgres whose password is literally `postgres` on every network
      # this laptop joins — coffee shop wifi included. The bare `docker run` this
      # replaced had the same hole; it is closed here rather than inherited.
      # Compose-internal traffic is unaffected: services use `postgres:5432` on
      # the project network and never touch a published port.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ideacheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ic-redis
    ports:
      # 6380, not 6379, for the same reason as above. Loopback-bound for the
      # same reason as Postgres, and more urgently: this Redis has NO password,
      # so an unauthenticated FLUSHALL is one `redis-cli -h` away from anyone
      # sharing the network.
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  research:
    build:
      context: ./apps/research
      # Default target: signals only. For Step 8, build with
      #   target: simulation
      # and expect a multi-gigabyte image (torch + sentence-transformers).
      target: base
    ports:
      # Loopback-bound like the other two. This API takes no auth and its
      # endpoints spend money (they drive LLM calls), so it must not be
      # reachable from the network. `apps/chat` calls it from the host.
      - "127.0.0.1:8099:8099"
    environment:
      # ─────────────────────────────────────────────────────────────────────
      # FAIL-CLOSED. `RESEARCH_HOSTED` is unset in `app/config.py` terms only
      # if it is absent; it defaults to TRUE there, which bars both Reddit
      # lanes. It is set explicitly to `false` here because a LOCAL dev stack
      # is self-host by definition — the developer is the only user and their
      # own data subject.
      #
      # DO NOT COPY THIS LINE INTO A DEPLOYED ENVIRONMENT. Read
      # `apps/research/app/sources/reddit_gate.py` first.
      # ─────────────────────────────────────────────────────────────────────
      RESEARCH_HOSTED: "false"

      # The default source set: Hacker News plus the keyless web ladder. Both
      # keyless, both legally boring. Reddit is NOT here even in self-host —
      # enabling it takes two deliberate acts (this list AND
      # REDDIT_ENABLED_ACK), which is the point.
      RESEARCH_ENABLED_SOURCES: "hackernews,web-keyless"

      # Optional, and passed through rather than defaulted:
      #   GITHUB_TOKEN         — required by the `github` source
      #   REDDIT_ENABLED_ACK   — required by both Reddit sources
      #   RESEARCH_SEARXNG_URL — your own instance; see note 1 above
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      REDDIT_ENABLED_ACK: "${REDDIT_ENABLED_ACK:-}"
      RESEARCH_SEARXNG_URL: "${RESEARCH_SEARXNG_URL:-}"

      # Step 8. `RESEARCH_SIM_CONCURRENCY` overrides OASIS's `semaphore=`, whose
      # own default is 128 — high enough to 429 a shared gateway, and a 429
      # storm inside OASIS surfaces as agents that "chose to do nothing", which
      # is indistinguishable from genuine disinterest.
      RESEARCH_SIM_MODEL: "${RESEARCH_SIM_MODEL:-gpt-4o-mini}"
      RESEARCH_SIM_BASE_URL: "${RESEARCH_SIM_BASE_URL:-}"
      RESEARCH_SIM_CONCURRENCY: "${RESEARCH_SIM_CONCURRENCY:-8}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8099/v1/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    container_name: ic-searxng
    ports:
      # Loopback only, like everything else here. 8888 rather than 8080 because
      # 8080 collides with half the tooling on a dev box.
      - "127.0.0.1:8888:8080"
    volumes:
      # Read-only: the container must not rewrite our settings on boot. SearXNG
      # merges this over its defaults because the file sets
      # `use_default_settings: true`.
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      # Bound at 127.0.0.1 so this URL is only ever right from the host.
      SEARXNG_BASE_URL: "http://localhost:8888/"
      # Overrides `server.secret_key` in settings.yml. The default below is fine
      # for a loopback-only dev instance: this secret signs the image proxy and
      # the limiter, and both are disabled.
      SEARXNG_SECRET: "${SEARXNG_SECRET:-idea-check-local-dev-not-a-real-secret}"
    healthcheck:
      # /healthz is SearXNG's own endpoint and does NOT hit a search engine, so
      # this stays green when the upstream engines are rate-limiting.
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:8080/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  # Named, so `docker compose down` and any later recreate reattach the same
  # bytes. Before adoption these were anonymous volumes, which compose would
  # not have reattached — it would have started an EMPTY database and looked
  # like it worked.
  pgdata:
  redisdata:
